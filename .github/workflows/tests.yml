name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Тесты не требуют PostgreSQL: без DATABASE_URL/POSTGRES_HOST
      # Django переключается на SQLite.
      - name: Run test suite
        run: pytest --cov=app --cov-report=term-missing
