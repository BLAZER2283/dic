server {
  listen 80;
  server_name _;

  # Proxy API requests to Django backend
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Serve React app (ucrp) under /ucrp/
  # Redirect plain /ucrp to /ucrp/
  location = /ucrp {
    return 301 /ucrp/;
  }

  location /ucrp/ {
    alias /usr/share/nginx/html/ucrp/;
    try_files $uri $uri/ /ucrp/index.html;
  }

  # Serve Vue app (dic) under /dic/
  # Redirect plain /dic to /dic/
  location = /dic {
    return 301 /dic/;
  }

  location /dic/ {
    alias /usr/share/nginx/html/dic/;
    try_files $uri $uri/ /dic/index.html;
  }

  # Redirect root to one of the apps (optional)
  location = / {
    return 302 /dic/;
  }
}
